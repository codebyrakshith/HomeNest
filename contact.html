<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Owner | HomeNest</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <header class="navbar">

        <div class="logo">
            🏠 HomeNest
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="favorites.html">
                Favorites
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="admin.html">
                Admin
            </a>

            <button
                id="theme-toggle"
                title="Toggle Dark Mode"
            >
                🌙
            </button>

        </nav>

    </header>


    <!-- ========================= -->
    <!-- CONTACT -->
    <!-- ========================= -->

    <section class="contact-section">

        <div class="contact-container">

            <h1>
                Contact Property Owner
            </h1>

            <p>
                Fill in the details below and we'll send your enquiry.
            </p>

            <div id="selected-property"></div>

            <form id="contact-form">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <label>
                    Message
                </label>

                <textarea
                    id="message"
                    rows="6"
                    placeholder="I am interested in this property..."
                    required
                ></textarea>

                <button
                    type="submit"
                    class="contact-submit"
                >
                    Send Message
                </button>

            </form>

            <p id="form-message"></p>

        </div>

    </section>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="footer">

        <div class="footer-content">

            <div>

                <h2>
                    🏠 HomeNest
                </h2>

                <p>
                    Your trusted property partner.
                </p>

            </div>

            <div>

                <h3>
                    Quick Links
                </h3>

                <a href="index.html">
                    Home
                </a>

                <a href="favorites.html">
                    Favorites
                </a>

                <a href="admin.html">
                    Admin
                </a>

            </div>

            <div>

                <h3>
                    Contact
                </h3>

                <p>
                    📧 info@homenest.com
                </p>

                <p>
                    📞 +91 9876543210
                </p>

            </div>

        </div>

        <div class="footer-bottom">

            © 2026 HomeNest. All Rights Reserved.

        </div>

    </footer>

    <script src="js/properties-data.js"></script>

    <script src="js/contact.js"></script>

    <script src="js/theme.js"></script>

</body>

</html>
