<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | HomeNest</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <header class="navbar">

        <div class="logo">
            🏠 HomeNest
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="favorites.html">
                Favorites
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="admin.html">
                Admin
            </a>

            <button
                id="theme-toggle"
                title="Toggle Dark Mode"
            >
                🌙
            </button>

        </nav>

    </header>


    <!-- ========================= -->
    <!-- ADMIN -->
    <!-- ========================= -->

    <section class="admin-section">

        <div class="admin-container">


            <!-- ========================= -->
            <!-- LOGIN CARD -->
            <!-- ========================= -->

            <div
                class="admin-card"
                id="login-card"
            >

                <h2>
                    Admin Login
                </h2>

                <form id="login-form">

                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">

                        Login

                    </button>

                </form>

                <p id="login-message"></p>

            </div>


            <!-- ========================= -->
            <!-- ADMIN DASHBOARD -->
            <!-- ========================= -->

            <div
                id="admin-menu"
                class="admin-card"
                style="display:none;"
            >

                <h2>
                    Admin Dashboard
                </h2>

                <p>
                    Welcome to the HomeNest Admin Panel.
                </p>

                <br>

                <div class="dashboard">

                    <div class="dashboard-card">

                        <h3>
                            🏠 Properties
                        </h3>

                        <h2 id="property-count">
                            0
                        </h2>

                    </div>

                    <div class="dashboard-card">

                        <h3>
                            ❤️ Favorites
                        </h3>

                        <h2 id="favorite-count">
                            0
                        </h2>

                    </div>

                    <div class="dashboard-card">

                        <h3>
                            📩 Enquiries
                        </h3>

                        <h2 id="enquiry-count">
                            0
                        </h2>

                    </div>

                    <div class="dashboard-card">

                        <h3>
                            👤 Status
                        </h3>

                        <h2>
                            Online
                        </h2>

                    </div>

                </div>

                <br>

                <a
                    href="admin-properties.html"
                    class="property-button"
                >
                    ➕ Manage Properties
                </a>

                <br><br>

                <button
                    id="view-enquiries"
                    class="property-button"
                >
                    📩 View Enquiries
                </button>

                <br><br>

                <button
                    id="logout-button"
                >
                    🚪 Logout
                </button>

            </div>


            <!-- ========================= -->
            <!-- ENQUIRIES -->
            <!-- ========================= -->

            <div
                id="enquiries-container"
                class="admin-card"
                style="display:none;"
            >

                <h2>
                    Customer Enquiries
                </h2>

                <div
                    id="enquiries-list"
                >

                </div>

            </div>

        </div>

    </section>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="footer">

        <div class="footer-bottom">

            © 2026 HomeNest. All Rights Reserved.

        </div>

    </footer>

    <script src="js/properties-data.js"></script>

    <script src="js/admin.js"></script>

    <script src="js/theme.js"></script>

</body>

</html>
